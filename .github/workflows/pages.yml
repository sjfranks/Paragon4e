name: Publish to GitHub Pages

# Paragon is static: no build step. On every push to main this checks the rules engine,
# stamps the commit into the page (so phones load fresh scripts and a fresh offline cache),
# and publishes the site to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the rules engine and data
        run: node tools/test.js
      - name: Build the site
        run: |
          mkdir _site
          cp -r index.html app.css manifest.webmanifest sw.js icon.svg icon-*.png js _site/
          sed -i "s/?v=BUILD/?v=${GITHUB_SHA::8}/g" _site/index.html
          sed -i "s/paragon-BUILD/paragon-${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll
      - name: Publish to the gh-pages branch
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
